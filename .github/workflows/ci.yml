name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff pytest-cov
      - name: Ruff (линтер)
        run: ruff check --config ../ruff.toml .
      - name: Ruff (формат)
        # Пока предупреждение: app/llm/_common.py не отформатирован (Issue Ангелине).
        # Убрать continue-on-error после исправления.
        continue-on-error: true
        run: ruff format --check --config ../ruff.toml .
      - name: Pytest с покрытием
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml
      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Установка зависимостей
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Сборка
        run: npm run build
